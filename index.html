<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Xsolla — Market Rive Section</title>

  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f2f3;
      color: #16191a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: #f1f2f3;
    }

    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: #f1f2f3;
    }

    button,
    input {
      font: inherit;
    }

    .page-placeholder {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: clamp(32px, 7vw, 96px) 24px;
      background:
        radial-gradient(circle at 18% 18%, rgba(230, 20, 70, 0.07), transparent 28%),
        #f1f2f3;
    }

    .placeholder-card {
      width: min(1136px, 100%);
      padding: clamp(28px, 5vw, 64px);
      border: 1px dashed rgba(22, 25, 26, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.48);
    }

    .placeholder-card__label {
      margin: 0 0 30px;
      color: rgba(22, 25, 26, 0.48);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .placeholder-card__line {
      height: clamp(22px, 3.4vw, 46px);
      border-radius: 999px;
      background: rgba(22, 25, 26, 0.08);
    }

    .placeholder-card__line + .placeholder-card__line {
      margin-top: 14px;
    }

    .placeholder-card__line:first-of-type {
      width: 70%;
    }

    .placeholder-card__line:nth-of-type(2) {
      width: 92%;
    }

    .placeholder-card__line:nth-of-type(3) {
      width: 56%;
    }

    .market-section {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: clamp(56px, 8vw, 120px) 24px;
      overflow: visible;
      background: #e9ebed;
    }

    .rive-frame {
      --rive-scale: 1;
      position: relative;
      width: min(1136px, calc(100vw - 48px));
      aspect-ratio: 1136 / 564;
      overflow: visible;
      background: #10191c;
      contain: layout size;
      isolation: isolate;
    }

    #rive-canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 1238px;
      height: 620px;
      transform: scale(var(--rive-scale));
      transform-origin: top left;
      touch-action: pan-y;
    }

    .loader {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      background: #10191c;
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
      letter-spacing: 0.04em;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .loader[hidden],
    .load-error[hidden] {
      display: none;
    }

    .loader__inner {
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-top-color: #ec2852;
      border-radius: 50%;
      animation: spin 720ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(1turn); }
    }

    .load-error {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #10191c;
      color: #fff;
      text-align: center;
    }

    .load-error__inner {
      width: min(440px, 100%);
    }

    .load-error strong {
      display: block;
      margin-bottom: 8px;
      font-size: clamp(16px, 2vw, 20px);
    }

    .load-error p {
      margin: 0 auto 16px;
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
      line-height: 1.55;
    }

    .dev-status {
      position: fixed;
      z-index: 10;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(13, 18, 20, 0.78);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
      color: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px);
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .page-placeholder,
      .market-section {
        padding-right: 16px;
        padding-left: 16px;
      }

      .rive-frame {
        width: calc(100vw - 32px);
      }

      .placeholder-card {
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 1.5s;
      }

      .loader {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="page-placeholder" aria-label="Placeholder перед Rive-секцией">
      <div class="placeholder-card">
        <p class="placeholder-card__label">Placeholder · контент страницы до секции</p>
        <div class="placeholder-card__line"></div>
        <div class="placeholder-card__line"></div>
        <div class="placeholder-card__line"></div>
      </div>
    </section>

    <section class="market-section" aria-label="Xsolla market statistics">
      <div class="rive-frame" id="rive-frame" data-state="loading">
        <canvas id="rive-canvas" aria-label="Анимированная статистика Xsolla"></canvas>

        <div class="loader" id="loader" aria-live="polite">
          <div class="loader__inner">
            <span class="spinner" aria-hidden="true"></span>
            <span>Загрузка анимации…</span>
          </div>
        </div>

        <div class="load-error" id="load-error" hidden>
          <div class="load-error__inner">
            <strong>Не удалось загрузить Rive-файл</strong>
            <p id="error-text"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="dev-status" id="dev-status" hidden>Loading</div>

  <script src="https://unpkg.com/@rive-app/webgl2@2.38.4"></script>
  <script>
    (() => {
      "use strict";

      const RIV_FILE = "./3-Market_v01.riv";
      const ARTBOARD = "3 - Market";
      const STATE_MACHINE = "State Machine 1";
      const VIEW_MODEL = "MarketVM";
      const VIEW_MODEL_INSTANCE = "Instance";
      const TRIGGER_NAME = "isIn";
      const TRIGGER_THRESHOLD = 0.18;
      const BASE_WIDTH = 1136;
      const BASE_HEIGHT = 564;

      const frame = document.getElementById("rive-frame");
      const canvas = document.getElementById("rive-canvas");
      const loader = document.getElementById("loader");
      const errorPanel = document.getElementById("load-error");
      const errorText = document.getElementById("error-text");
      const devStatus = document.getElementById("dev-status");

      let player = null;
      let triggerHandle = null;
      let isReady = false;
      let isInViewport = false;
      let hasTriggered = false;
      let resizeFrame = 0;
      let dprQuery = null;
      let visibilityObserver = null;
      let resizeObserver = null;
      let fallbackVisibilityHandler = null;

      const devEnabled = new URLSearchParams(location.search).get("dev") === "1";
      devStatus.hidden = !devEnabled;

      const setStatus = (label, state = "loading") => {
        frame.dataset.state = state;
        devStatus.textContent = label;
      };

      const showError = (message) => {
        loader.hidden = true;
        errorPanel.hidden = false;
        errorText.textContent = message;
        setStatus("Load error", "error");
      };

      const hideError = () => {
        errorPanel.hidden = true;
        loader.hidden = false;
        setStatus("Loading", "loading");
      };

      const readError = (event) => {
        if (typeof event === "string") return event;
        if (typeof event?.data === "string") return event.data;
        if (event?.message) return event.message;
        return "Не удалось прочитать .riv-файл.";
      };

      const getEmbeddedRivBuffer = () => {
        const base64 = document.getElementById("rive-asset")?.textContent.trim();
        if (!base64 || base64 === "RIV_BASE64_PLACEHOLDER") {
          throw new Error("Встроенный Rive-ассет не найден.");
        }

        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes.buffer;
      };

      const connectMainViewModel = () => {
        let instance = player.viewModelInstance;

        if (!instance || instance.viewModelName !== VIEW_MODEL) {
          const viewModel = player.viewModelByName(VIEW_MODEL);
          if (!viewModel) throw new Error(`View Model «${VIEW_MODEL}» не найден.`);

          instance =
            viewModel.instanceByName(VIEW_MODEL_INSTANCE) ||
            viewModel.defaultInstance() ||
            viewModel.instance();

          if (instance) player.bindViewModelInstance(instance);
        }

        if (!instance) throw new Error(`Не удалось подключить View Model «${VIEW_MODEL}».`);

        const handle = instance.trigger(TRIGGER_NAME);
        if (!handle || typeof handle.trigger !== "function") {
          throw new Error(`Trigger «${TRIGGER_NAME}» не найден в ${VIEW_MODEL}.`);
        }

        triggerHandle = handle;
      };

      const fireEntrance = () => {
        if (!isReady || !isInViewport || hasTriggered || !triggerHandle) return;

        triggerHandle.trigger();
        hasTriggered = true;
        setStatus(`${VIEW_MODEL}.${TRIGGER_NAME} · fired`, "triggered");
        visibilityObserver?.disconnect();

        if (fallbackVisibilityHandler) {
          window.removeEventListener("scroll", fallbackVisibilityHandler);
          window.removeEventListener("resize", fallbackVisibilityHandler);
          fallbackVisibilityHandler = null;
        }
      };

      const updateFallbackVisibility = () => {
        const bounds = frame.getBoundingClientRect();
        const visibleHeight = Math.max(
          0,
          Math.min(bounds.bottom, window.innerHeight) - Math.max(bounds.top, 0)
        );
        isInViewport = visibleHeight / Math.max(1, bounds.height) >= TRIGGER_THRESHOLD;
        fireEntrance();
      };

      const watchVisibility = () => {
        if ("IntersectionObserver" in window) {
          visibilityObserver = new IntersectionObserver((entries) => {
            const entry = entries.find((item) => item.target === frame);
            if (!entry) return;

            isInViewport = entry.isIntersecting && entry.intersectionRatio >= TRIGGER_THRESHOLD;
            if (!hasTriggered) {
              setStatus(isInViewport ? "In view · waiting for Rive" : "Waiting for section", "ready");
            }
            fireEntrance();
          }, {
            threshold: [0, TRIGGER_THRESHOLD, 0.5, 1]
          });

          visibilityObserver.observe(frame);
          return;
        }

        fallbackVisibilityHandler = updateFallbackVisibility;
        window.addEventListener("scroll", fallbackVisibilityHandler, { passive: true });
        window.addEventListener("resize", fallbackVisibilityHandler, { passive: true });
        updateFallbackVisibility();
      };

      const resizePlayer = () => {
        resizeFrame = 0;
        const scale = frame.clientWidth / BASE_WIDTH;

        if (!isReady || !player) {
          frame.style.setProperty("--rive-scale", String(scale));
          return;
        }

        frame.style.setProperty("--rive-scale", "1");
        player.resizeDrawingSurfaceToCanvas();

        const dpr = player.devicePixelRatioUsed || window.devicePixelRatio || 1;

        player.layout = new window.rive.Layout({
          fit: window.rive.Fit.Layout,
          alignment: window.rive.Alignment.TopLeft,
          minX: 0,
          minY: 0,
          maxX: Math.round(BASE_WIDTH * dpr),
          maxY: Math.round(BASE_HEIGHT * dpr)
        });
        player.artboardWidth = BASE_WIDTH;
        player.artboardHeight = BASE_HEIGHT;
        frame.style.setProperty("--rive-scale", String(scale));
      };

      const requestResize = () => {
        if (!resizeFrame) resizeFrame = requestAnimationFrame(resizePlayer);
      };

      const handleDevicePixelRatioChange = () => {
        requestResize();
        watchDevicePixelRatio();
      };

      const watchDevicePixelRatio = () => {
        if (!window.matchMedia) return;
        dprQuery?.removeEventListener?.("change", handleDevicePixelRatioChange);
        dprQuery = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
        dprQuery.addEventListener?.("change", handleDevicePixelRatioChange, { once: true });
      };

      const onPlayerReady = () => {
        try {
          isReady = true;
          connectMainViewModel();
          resizePlayer();

          const webgl2Context = canvas.getContext("webgl2");
          frame.dataset.renderer = webgl2Context ? "webgl2" : "unavailable";
          if (!webgl2Context) throw new Error("WebGL2 недоступен в этом браузере.");

          loader.hidden = true;
          errorPanel.hidden = true;
          setStatus("Rive ready · waiting for section", "ready");
          fireEntrance();

          console.info("[Xsolla Market Rive]", {
            artboard: player.activeArtboard,
            stateMachine: STATE_MACHINE,
            viewModel: player.viewModelInstance?.viewModelName || VIEW_MODEL,
            trigger: TRIGGER_NAME,
            renderer: "WebGL2"
          });
        } catch (error) {
          isReady = false;
          showError(error.message || String(error));
        }
      };

      const boot = (source) => {
        if (!window.rive) {
          showError("Не загрузился WebGL2-рантайм Rive. Проверьте подключение к интернету.");
          return;
        }

        hideError();
        isReady = false;
        hasTriggered = false;
        triggerHandle = null;
        player?.cleanup();

        const sourceConfig = source.buffer
          ? { buffer: source.buffer }
          : { src: source.src };

        player = new window.rive.Rive({
          ...sourceConfig,
          canvas,
          artboard: ARTBOARD,
          stateMachines: STATE_MACHINE,
          autoplay: true,
          autoBind: true,
          useOffscreenRenderer: false,
          isTouchScrollEnabled: true,
          layout: new window.rive.Layout({
            fit: window.rive.Fit.Layout,
            alignment: window.rive.Alignment.TopLeft
          }),
          onLoad: onPlayerReady,
          onLoadError: (event) => {
            const detail = readError(event);
            showError(`Не удалось открыть встроенный ${RIV_FILE}: ${detail}`);
          }
        });
      };

      if ("ResizeObserver" in window) {
        resizeObserver = new ResizeObserver(requestResize);
        resizeObserver.observe(frame);
      }

      resizePlayer();
      watchVisibility();
      watchDevicePixelRatio();

      try {
        boot({ buffer: getEmbeddedRivBuffer() });
      } catch (error) {
        showError(error.message || String(error));
      }

      window.addEventListener("beforeunload", () => {
        if (resizeFrame) cancelAnimationFrame(resizeFrame);
        visibilityObserver?.disconnect();
        resizeObserver?.disconnect();
        dprQuery?.removeEventListener?.("change", handleDevicePixelRatioChange);
        if (fallbackVisibilityHandler) {
          window.removeEventListener("scroll", fallbackVisibilityHandler);
          window.removeEventListener("resize", fallbackVisibilityHandler);
        }
        player?.cleanup();
      }, { once: true });
    })();
  </script>
</body>
</html>
